name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Corepack on Node 26 (no longer bundled)
        if: matrix.node == '26'
        run: npm install -g corepack@0.36.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Validate backend and infrastructure
        run: corepack pnpm verify
      - name: Diagnose runtime
        run: corepack pnpm app:doctor -- --json

  browser:
    name: Browser / Node 24 / production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Require committed browser dependency lock
        shell: bash
        run: |
          if [ ! -f web/pnpm-lock.yaml ]; then
            echo '::error::Browser lockfile missing. Read START-HERE.md and commit web/pnpm-lock.yaml before release.'
            exit 1
          fi
      - name: Install browser dependencies reproducibly
        run: corepack pnpm --dir web install --frozen-lockfile
      - name: Typecheck browser
        run: corepack pnpm --dir web check
      - name: Build browser production bundle
        run: corepack pnpm --dir web build
      - name: Check compiled index exists
        shell: bash
        run: test -f web/dist/index.html
# A browser E2E and accessibility job is still a release blocker, not an omitted success.
