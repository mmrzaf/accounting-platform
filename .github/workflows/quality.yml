name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate backend and infrastructure
        run: pnpm verify
      - name: Diagnose runtime
        run: pnpm app:doctor -- --json

  browser:
    name: Browser / Node 24 / production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.20.0
      - name: Require committed browser dependency lock
        shell: bash
        run: |
          if [ ! -f web/pnpm-lock.yaml ]; then
            echo '::error::Browser lockfile missing. Read START-HERE.md and commit web/pnpm-lock.yaml before release.'
            exit 1
          fi
      - name: Install browser dependencies reproducibly
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck browser
        run: pnpm --dir web check
      - name: Build browser production bundle
        run: pnpm --dir web build
      - name: Check compiled index exists
        shell: bash
        run: test -f web/dist/index.html
      - name: Install Playwright Chromium and operating-system dependencies
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Exercise real browser workflows
        run: pnpm run web:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-results
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
# Financial/regulatory acceptance and full accessibility remain manual release gates.
