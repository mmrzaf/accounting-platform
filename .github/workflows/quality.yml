name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-foundation:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies with frozen lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Validate all TypeScript and executable behavior
        run: corepack pnpm verify
      - name: Diagnose runtime
        run: corepack pnpm app:doctor -- --json
# This does not certify TanStack Start, React, Drizzle, or browser E2E: packages are not yet integrated.
